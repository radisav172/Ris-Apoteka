services:
  db:
    image: postgres:16
    container_name: apoteka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apoteka
      POSTGRES_USER: apoteka_user
      POSTGRES_PASSWORD: apoteka_pass
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apoteka_user -d apoteka"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: apoteka_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
